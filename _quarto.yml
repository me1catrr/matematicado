format:
  html:
    theme: cosmo
    css: styles.css
    grid:
      sidebar-width: 270px
      body-width: 880px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    code-copy: true
    citations-hover: true
    link-citations: true
    reference-section-title: "Referencias"

crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "ecuación"
  thm-title: "Teorema"
  prp-title: "Proposición"
  def-title: "Definición"
  exm-title: "Ejemplo"
  lem-title: "Lema"
  cor-title: "Corolario"
  thm-prefix: "Teorema"
  prp-prefix: "Proposición"
  def-prefix: "Definición"
  exm-prefix: "Ejemplo"
